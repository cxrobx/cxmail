name: CXMail
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: $(CXMAIL_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
targets:
  CXMail:
    type: application
    platform: iOS
    sources: [CXMail]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cxmail.remote
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: CXMail/Info.plist
      properties:
        CFBundleDisplayName: CXMail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: app.cxmail.remote
            CFBundleURLSchemes: [cxmail]
        CXMailServerURL: $(CXMAIL_SERVER_URL)
  CXMailTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CXMailTests]
    dependencies: [{target: CXMail}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cxmail.remote.tests
        GENERATE_INFOPLIST_FILE: YES
  CXMailUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CXMailUITests]
    dependencies: [{target: CXMail}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cxmail.remote.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CXMail
schemes:
  CXMail:
    build:
      targets: {CXMail: all}
    test:
      targets: [CXMailTests, CXMailUITests]
