name: CXMail CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test -- --run
      - run: npm run build
      # --workspace, not just the manifest: src-tauri is a workspace root whose
      # members hold most of the backend. Without the flag this tests the app
      # package alone and stays green while covering none of the extracted crates.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
