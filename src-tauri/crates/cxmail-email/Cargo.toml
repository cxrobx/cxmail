[package]
name = "cxmail-email"
version = "1.0.0"
license = "BUSL-1.1"
publish = false
description = "cxmail's mail engine: IMAP, SMTP, OAuth2, parsing, sync, calendar, AI"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
# Generates OUT_DIR/ispdb_table.rs, which `email::autoconfig` include!s. OUT_DIR
# is per-crate, so this script has to live in the same crate as the module that
# consumes it — hence its own build.rs rather than the app's.

[dependencies]
cxmail-core = { path = "../cxmail-core" }
cxmail-db = { path = "../cxmail-db" }

rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# Named-zone resolution for user-entered event times (email::event_input).
chrono-tz = { workspace = true }
tokio = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
log = { workspace = true }

# IMAP
async-imap = "0.10"
async-native-tls = "0.5"
native-tls = "0.2"
tokio-native-tls = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }

# Email parsing + sanitization
mail-parser = "0.9"
ammonia = "4"

# SMTP
mail-send = "0.4"
mail-builder = "0.3"

# OAuth2 + HTTP
oauth2 = "4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
urlencoding = "2.1.3"
roxmltree = "0.21.1"
hickory-resolver = { version = "0.25.2", default-features = false, features = ["tokio", "system-config"] }
