[package]
name = "cxmail-core"
version = "1.0.0"
license = "GPL-3.0-only"
publish = false
description = "Shared foundations for cxmail: errors, keychain, secrets, and the pure mail helpers"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# AppError::Database(#[from] rusqlite::Error) — the reason this crate carries a
# SQLite dependency despite touching no database itself. Pinned once in
# [workspace.dependencies]: a second rusqlite version in the graph would make
# `Connection` a different type in each crate, and the mismatch reads as a
# baffling trait error rather than a version conflict.
rusqlite = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
regex = { workspace = true }
html-escape = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
keyring = { workspace = true }
security-framework = { workspace = true }
log = { workspace = true }
dirs = { workspace = true }
